name: generate pacman contribution graph (jamun theme)

on:
  schedule:
    - cron: '0 0 * * *'   # every 24 hours
  workflow_dispatch:       # manual run button
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: recolor SVGs to jamun purple
        run: |
          cat > recolor.py << 'PY'
          import colorsys, glob, re, sys

          HUE = 280 / 360  # jamun purple

          def recolor(r, g, b):
              h, l, s = colorsys.rgb_to_hls(r / 255, g / 255, b / 255)
              if s > 0.2 and 85 / 360 <= h <= 170 / 360:          # greens -> jamun purple
                  h, s, l = HUE, min(s, 0.55), 0.15 + l * 0.75
              elif s < 0.3 and 0.03 < l < 0.3:                    # dark greys -> dark plum
                  h, s = HUE, 0.40
              else:
                  return None
              r, g, b = colorsys.hls_to_rgb(h, l, s)
              return round(r * 255), round(g * 255), round(b * 255)

          def hex_sub(m):
              x = m.group(1)
              if len(x) == 3:
                  x = "".join(c * 2 for c in x)
              out = recolor(int(x[0:2], 16), int(x[2:4], 16), int(x[4:6], 16))
              return m.group(0) if out is None else "#%02x%02x%02x" % out

          def rgb_sub(m):
              r, g, b = (int(m.group(i)) for i in (1, 2, 3))
              out = recolor(r, g, b)
              return m.group(0) if out is None else "rgb(%d,%d,%d)" % out

          for path in sys.argv[1:] or glob.glob("dist/*.svg"):
              s = open(path, encoding="utf-8").read()
              s = re.sub(r"#([0-9a-fA-F]{6}|[0-9a-fA-F]{3})\b", hex_sub, s)
              s = re.sub(r"rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)", rgb_sub, s)
              open(path, "w", encoding="utf-8").write(s)
              print("recolored", path)

          PY
          python3 recolor.py dist/*.svg

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
