<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="60%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="spidey" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e62429"/>
      <stop offset="100%" stop-color="#1b1464"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .webline { stroke: #d9d9d9; stroke-width: 1; opacity: 0.35; }
      .letter {
        font-family: 'Segoe UI', Arial, sans-serif;
        font-weight: 800;
        font-size: 58px;
        fill: url(#spidey);
        filter: url(#glow);
        opacity: 0;
      }
      @keyframes flyIn {
        0%   { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)); opacity: 0; }
        70%  { transform: translate(2px, -6px) rotate(-3deg); opacity: 1; }
        85%  { transform: translate(-1px, 2px) rotate(2deg); opacity: 1; }
        100% { transform: translate(0,0) rotate(0deg); opacity: 1; }
      }
      .l0 { --sx:-260px; --sy:-90px; --sr:-140deg; animation: flyIn 0.9s ease-out 0.1s forwards; }
      .l1 { --sx:280px;  --sy:-110px; --sr:130deg;  animation: flyIn 0.9s ease-out 0.3s forwards; }
      .l2 { --sx:-300px; --sy:80px;  --sr:-100deg; animation: flyIn 0.9s ease-out 0.5s forwards; }
      .l3 { --sx:320px;  --sy:100px; --sr:110deg;  animation: flyIn 0.9s ease-out 0.7s forwards; }
      .l4 { --sx:-260px; --sy:-60px; --sr:-80deg;  animation: flyIn 0.9s ease-out 0.9s forwards; }
      .l5 { --sx:260px;  --sy:-70px; --sr:90deg;   animation: flyIn 0.9s ease-out 1.1s forwards; }
      .l6 { --sx:-300px; --sy:60px;  --sr:-120deg; animation: flyIn 0.9s ease-out 1.3s forwards; }
      .l7 { --sx:300px;  --sy:90px;  --sr:100deg;  animation: flyIn 0.9s ease-out 1.5s forwards; }
      .l8 { --sx:-240px; --sy:-40px; --sr:-60deg;  animation: flyIn 0.9s ease-out 1.7s forwards; }
      .l9 { --sx:240px;  --sy:-50px; --sr:70deg;   animation: flyIn 0.9s ease-out 1.9s forwards; }
      .l10 { --sx:-280px; --sy:70px; --sr:-90deg;  animation: flyIn 0.9s ease-out 2.1s forwards; }
      .l11 { --sx:280px;  --sy:80px; --sr:80deg;   animation: flyIn 0.9s ease-out 2.3s forwards; }
      .l12 { --sx:-220px; --sy:-30px; --sr:-50deg; animation: flyIn 0.9s ease-out 2.5s forwards; }

      .subtitle {
        font-family: 'Consolas', monospace;
        font-size: 18px;
        fill: #ffffff;
        opacity: 0;
        animation: fadeUp 1s ease-out 2.9s forwards;
      }
      @keyframes fadeUp {
        0% { opacity: 0; transform: translateY(14px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      .strand {
        stroke: #f2f2f2;
        stroke-width: 2;
        fill: none;
        stroke-dasharray: 400;
        stroke-dashoffset: 400;
        opacity: 0.85;
        animation: draw 1.4s ease-out forwards;
      }
      @keyframes draw {
        to { stroke-dashoffset: 0; }
      }

      .spider-body { fill: #0a0a0a; stroke: #e62429; stroke-width: 0.8; }
      .spider-leg { stroke: #0a0a0a; stroke-width: 1.3; fill: none; stroke-linecap: round; }

      .web-shot {
        stroke: #f2f2f2;
        stroke-width: 1.4;
        fill: none;
        stroke-dasharray: 90;
        stroke-dashoffset: 90;
        opacity: 0;
      }
      @keyframes shoot {
        0%   { stroke-dashoffset: 90; opacity: 0; }
        8%   { opacity: 0.9; }
        35%  { stroke-dashoffset: 0; opacity: 0.9; }
        55%  { opacity: 0; stroke-dashoffset: 0; }
        100% { opacity: 0; stroke-dashoffset: 90; }
      }
      .shot1 { animation: shoot 4s ease-out 1s infinite; }
      .shot2 { animation: shoot 4.6s ease-out 2.2s infinite; }
      .shot3 { animation: shoot 5.2s ease-out 3.4s infinite; }

      @keyframes scuttle1 {
        0%   { offset-distance: 0%; }
        100% { offset-distance: 100%; }
      }
      .spider1 {
        offset-path: path("M 40 20 Q 250 90 460 30 Q 650 -10 860 60");
        animation: scuttle1 9s linear infinite;
      }
      .spider2 {
        offset-path: path("M 850 200 Q 600 240 420 190 Q 220 140 60 210");
        animation: scuttle1 11s linear infinite reverse;
      }
      .spider3 {
        offset-path: path("M 450 10 Q 470 130 450 250");
        animation: scuttle1 6.5s ease-in-out infinite alternate;
      }
    </style>
  </defs>

  <rect width="900" height="260" fill="url(#bg)"/>

  <!-- background web lines -->
  <g class="webline">
    <line x1="0" y1="0" x2="900" y2="260"/>
    <line x1="900" y1="0" x2="0" y2="260"/>
    <line x1="450" y1="0" x2="450" y2="260"/>
    <line x1="0" y1="130" x2="900" y2="130"/>
    <circle cx="450" cy="130" r="60" fill="none" stroke="#d9d9d9" stroke-width="1" opacity="0.25"/>
    <circle cx="450" cy="130" r="120" fill="none" stroke="#d9d9d9" stroke-width="1" opacity="0.2"/>
    <circle cx="450" cy="130" r="180" fill="none" stroke="#d9d9d9" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- web-shot bursts fired periodically -->
  <path class="web-shot shot1" d="M 60 30 Q 130 -10 190 25" />
  <path class="web-shot shot2" d="M 800 190 Q 730 230 670 195" />
  <path class="web-shot shot3" d="M 460 40 Q 500 90 455 140" />

  <!-- spider 1 -->
  <g class="spider1">
    <g class="spider-body">
      <ellipse cx="0" cy="0" rx="5" ry="4"/>
      <circle cx="6" cy="-1" r="2.6"/>
    </g>
    <g class="spider-leg">
      <path d="M -3 -2 Q -9 -7 -13 -4"/>
      <path d="M -3 0 Q -10 0 -14 3"/>
      <path d="M -3 2 Q -9 6 -12 9"/>
      <path d="M 3 -2 Q 9 -7 13 -5"/>
      <path d="M 3 0 Q 10 1 14 4"/>
      <path d="M 3 2 Q 9 7 12 10"/>
    </g>
  </g>

  <!-- spider 2 -->
  <g class="spider2">
    <g class="spider-body">
      <ellipse cx="0" cy="0" rx="4.4" ry="3.6"/>
      <circle cx="5.4" cy="-1" r="2.3"/>
    </g>
    <g class="spider-leg">
      <path d="M -3 -2 Q -8 -6 -12 -3"/>
      <path d="M -3 0 Q -9 0 -12 3"/>
      <path d="M -3 2 Q -8 5 -11 8"/>
      <path d="M 3 -2 Q 8 -6 11 -4"/>
      <path d="M 3 0 Q 9 1 12 4"/>
      <path d="M 3 2 Q 8 6 11 9"/>
    </g>
  </g>

  <!-- spider 3 (smaller, vertical patrol) -->
  <g class="spider3">
    <g class="spider-body">
      <ellipse cx="0" cy="0" rx="3.6" ry="3"/>
      <circle cx="4.4" cy="-0.8" r="1.9"/>
    </g>
    <g class="spider-leg">
      <path d="M -2.4 -1.6 Q -6.5 -5 -9.5 -2.5"/>
      <path d="M -2.4 0 Q -7 0 -9.5 2.4"/>
      <path d="M -2.4 1.6 Q -6.5 4 -8.7 6.5"/>
      <path d="M 2.4 -1.6 Q 6.5 -5 9 -3.2"/>
      <path d="M 2.4 0 Q 7 1 9.5 3.2"/>
      <path d="M 2.4 1.6 Q 6.5 5 8.7 7.2"/>
    </g>
  </g>

  <!-- name: MAYANK SEJWAR flying in like jumbled letters snapping into place -->
  <g transform="translate(80,150)">
    <text class="letter l0"  x="0"   y="0">M</text>
    <text class="letter l1"  x="52"  y="0">A</text>
    <text class="letter l2"  x="100" y="0">Y</text>
    <text class="letter l3"  x="145" y="0">A</text>
    <text class="letter l4"  x="193" y="0">N</text>
    <text class="letter l5"  x="245" y="0">K</text>
    <text class="letter l6"  x="330" y="0">S</text>
    <text class="letter l7"  x="378" y="0">E</text>
    <text class="letter l8"  x="418" y="0">J</text>
    <text class="letter l9"  x="450" y="0">W</text>
    <text class="letter l10" x="510" y="0">A</text>
    <text class="letter l11" x="552" y="0">R</text>
  </g>

  <text class="subtitle" x="450" y="215" text-anchor="middle">
    &#8226; AI/ML &amp; Backend Developer &#8226; RAG &amp; Automation Builder &#8226;
  </text>
</svg>
